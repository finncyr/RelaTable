services:
  relatable:
    build: .
    image: relatable:latest
    container_name: relatable
    restart: unless-stopped
    # ponytail: kein Port-Binding — Traefik routet über shared Docker-Netzwerk.
    expose:
      - '3000'
    env_file:
      - .env
    environment:
      ORIGIN: 'https://relatable.quag.pro'
      PUBLIC_MAP_PROVIDER: 'leaflet'
      # Pinned here (not just in .env) so a typo or a stale local-dev .env can
      # never silently point Prisma/uploads at the wrong path again.
      DATABASE_URL: 'file:/data/relatable.db'
      DATA_DIR: '/data'
    networks:
      - caddy
    volumes:
      - relatable-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  relatable-data:
networks:
  caddy:
    external: true
